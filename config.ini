; ============================================================================
; pipeline.app 配置文件
; 优先级：命令行参数 > 本文件 > 内置默认值
; 启动：  .venv\Scripts\python.exe -m pipeline.app            （自动读同目录 config.ini）
;         .venv\Scripts\python.exe -m pipeline.app -c other.ini
; 说明：本文件按功能分组；每个配置项上一行是它的作用。留空的项 = 用内置默认值。
;       延迟策略只有两个旋钮：sentence_gap_ms（句间停顿）与 utterance_gap_ms（语段结束）。
; ============================================================================

[pipeline]

; ---------------------------------------------------------------------------
; 1. 服务端点与模型
; ---------------------------------------------------------------------------
; ASR 服务地址（llama-server / Qwen3-ASR 容器）
asr_url = http://127.0.0.1:8081
; ASR 请求里的模型名（服务端 --alias，通常无需改）
asr_model = qwen3-asr
; ASR 语言预填提示（Chinese / English / Cantonese ...）：让模型跳过元数据前缀
language = Chinese
; TTS 服务地址（带 /tts 接口的 llama-server 容器）
tts_url = http://127.0.0.1:8082
; TTS 合成语种参数，传给 /tts 的 lang 字段
tts_lang = zh
; TTS 并发 worker 数
tts_workers = 1
; 声音克隆参考音频
speaker_ref = speaker.wav

; ---------------------------------------------------------------------------
; 2. 音频设备
; ---------------------------------------------------------------------------
; 输入设备
;mic_device = CABLE Output
mic_device = USB2.0
; 软件麦克风增益（乘数）：>1 放大后 clip 到 ±1；建议 <20 防削波
mic_gain = 8.0
; 输出设备
;output_device = CABLE Input
output_device = Realtek(R) Audio

; ---------------------------------------------------------------------------
; 3. 停顿策略（核心：两个旋钮决定句界与语段结束）
; ---------------------------------------------------------------------------
; 【句间停顿】
sentence_gap_ms = 450
; 【语段结束】
utterance_gap_ms = 1200
; 长句兜底
window_seconds = 8.0
; 转写后无法切分时（无标点长句）的强制切分字数
max_split_chars = 40

; ---------------------------------------------------------------------------
; 4. 语音/静音判定（固定门限，无自适应底噪）
; ---------------------------------------------------------------------------
; 固定能量门限（RMS）
silence_threshold = 0.01

; ---------------------------------------------------------------------------
; 5. 运行节奏
; ---------------------------------------------------------------------------
; 有声时的轮询节拍（毫秒）：只影响静默计时的精度，不再决定 ASR 调用时机
asr_interval_ms = 400
; 静默时的轮询节拍（毫秒）：省 CPU/GPU，一有声立即恢复
asr_idle_interval_ms = 600
; ASR 是否流式（SSE 增量）：块很短（一句），两者差别很小
asr_stream = false
; 流式模式下 partial 文本的发布节流（毫秒）
stream_emit_ms = 200

; ---------------------------------------------------------------------------
; 6. TTS 输出与播放
; ---------------------------------------------------------------------------
; TTS 是否外放
mute_during_tts = true
; 句子之间的静音（毫秒）；使用声音克隆时自动归 0（整段尾部自带停顿）
gap_ms = 0
