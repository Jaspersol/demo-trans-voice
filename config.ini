; pipeline.app 配置文件
; 优先级：命令行参数 > 本文件 > 内置默认值
; 启动：.venv\Scripts\python.exe -m pipeline.app   （自动读取同目录 config.ini）
; 或：  .venv\Scripts\python.exe -m pipeline.app -c other.ini

[pipeline]

; ---- ASR 服务（llama-server 容器，端口 8081）----
asr_url = http://127.0.0.1:8081
asr_model = qwen3-asr
; 预填语言提示：Chinese / English / Cantonese ...
language = Chinese

; 输入设备：留空 = 系统默认（装 CABLE 后默认变成 CABLE Output，静音！）
; 推荐填设备名（支持部分匹配，不怕设备序号变动）；也可填数字索引
; 即 "麦克风 (USB2.0 Device)"
;mic_device = CABLE Output
mic_device = USB2.0


; ---- TTS 服务（tts-wrapper 容器，端口 8082）----
tts_workers = 2
tts_lang = zh
; 声音克隆参考音频：3 秒左右干净人声（本地路径），留空 = 模型默认随机音色
speaker_ref = speaker.wav

; ---- 音频输出 ----
; 留空 = 系统默认扬声器（你自己听得到）
; CABLE Input = 程序播到虚拟声卡，目标软件把 "CABLE Output" 选为麦克风即可接通
;output_device = CABLE Input
output_device = Realtek(R) Audio

; ---- 调速/调质参数 ----
; ASR 滑动窗口长度（秒）与重转写节奏（毫秒）
window_seconds = 8.0
asr_interval_ms = 600
; 稳定前缀确认字符数（越大越稳但延迟越高）
confirm_chars = 2
; 切分器：逗号切句最小字数 / 无标点强制切分字数 / 停顿切句超时（毫秒）
clause_min_chars = 8
hard_max_chars = 20
idle_flush_ms = 800
; 静音能量门限（RMS）：实际门限 = 底噪EMA x margin，但不低于此绝对下限
; （自适应跟踪环境底噪，换麦克风/换环境无需重调）
silence_threshold = 0.0001
; 门限倍数：threshold = noise_floor_ema x silence_margin
silence_margin = 3.0
; 连续静音超过 3 个周期后，轮询间隔放宽到此值（省 GPU）；有声立即恢复
asr_idle_interval_ms = 1500
; TTS 段丢失时播放器最长等待（毫秒），超时跳段防卡死
reorder_timeout_ms = 3000
; 句间静音（毫秒）；使用声音克隆时自动为 0（整段尾部自带停顿）
gap_ms = 60
; 逗号切句开关：true = 遇逗号即切送 TTS（低延迟、句子可能碎）
;                false = 关闭逗号切句，完整句子（句号/问号/停顿）才送 TTS
split_on_comma = true
; ASR 增量转写时附带的上文音频秒数（提供语境，减少缺字）
asr_context_seconds = 2.0
